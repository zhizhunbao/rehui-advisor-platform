[project]
name = "north-america-advisor"
version = "1.0.0"
description = "北美生活决策顾问系统 - 智能推荐平台"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic[email]>=2.10.0",
    "pydantic-settings>=2.6.0",
    "supabase>=2.10.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.1.0",
    "python-dotenv>=1.0.0",
    "bcrypt>=4.2.0",
    "pyjwt>=2.10.0",
    "httpx>=0.28.0",
    "google-genai>=1.0.0",
    "passlib>=1.7.4",
    "apscheduler>=3.11.2",
    # Learning 模块依赖
    "mammoth>=1.8.0",      # docx 转 markdown
    "pymupdf>=1.24.0",     # pdf 处理
    "html2text>=2024.2.0", # 网页转 markdown
    "python-multipart>=0.0.21",
    "langchain>=1.2.4",
    "langchain-openai>=1.1.7",
    "langchain-community>=0.4.1",
    "chromadb>=1.4.1",
    "openai>=2.15.0",
    "langchain-google-genai>=4.2.0",
    "google-generativeai>=0.8.6",
    "langchain-groq>=1.1.1",
    "langchain-huggingface>=1.2.0",
    "groq>=0.37.1",
    "sentence-transformers>=5.2.0",
    "playwright>=1.57.0",
    "pdfplumber>=0.11.9",
    "pypdf>=6.6.0",
    "markdown-it-py>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
