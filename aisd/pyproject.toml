[project]
name = "aisd"
version = "0.1.0"
description = "AI & Software Development Learning Environment"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Core scientific computing
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "matplotlib>=3.10.8",
    "scikit-learn>=1.3.0",
    # Machine Learning (ml)
    "scipy>=1.11.0",
    "seaborn>=0.12.0",
    # Machine Vision (mv)
    "opencv-python>=4.12.0.88",
    # NLP
    "nltk>=3.9.1",
    # RL (Reinforcement Learning)
    "gymnasium>=0.29.0",
    # Web scraping
    "playwright>=1.40.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    # PDF processing
    "pdfplumber>=0.11.0",
    "pypdf>=6.6.0",
    "pymupdf>=1.26.7",
    "pytesseract>=0.3.13",
    "pillow>=12.1.0",
    "pdf2image>=1.17.0",
    "pix2text>=1.1.4",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "ipython>=8.12.0",
    "jupyter>=1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["scripts", "courses"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
